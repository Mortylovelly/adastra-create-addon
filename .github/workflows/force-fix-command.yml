name: Fix command tool and build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Fix command tool and push safely
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
            from pathlib import Path
            path = Path('src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java')
            text = path.read_text(encoding='utf-8')
            old = '            int result = server.getCommandManager().executeWithPrefix(server.getCommandSource(), command);\n'
            new = '            server.getCommandManager().executeWithPrefix(server.getCommandSource(), command);\n'
            changed = old in text
            text = text.replace(old, new, 1)
            text = text.replace('            data.addProperty("result", result);\n', '', 1)
            path.write_text(text, encoding='utf-8')
            print('Needs fix:', changed)
            PY

            if git diff --quiet -- src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java; then
              echo "Command tool is already fixed."
              break
            fi

            git add src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
            git commit -m "Fix command tool compilation"

            if git push origin HEAD:main; then
              echo "Fix pushed successfully."
              break
            fi

            echo "Push raced with another commit; retrying from latest main."
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
          done

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent-fixed
          path: build/libs/*.jar
