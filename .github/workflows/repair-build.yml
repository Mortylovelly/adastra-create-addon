name: Repair and Build Minecraft AI Agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Fix commandResult compilation error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java')
          text = path.read_text(encoding='utf-8')
          original = text

          old = '''    private static JsonObject commandResult(MinecraftServer server, String command) {
          try {
              int result = server.getCommandManager().executeWithPrefix(server.getCommandSource(), command);
              JsonObject data = new JsonObject();
              data.addProperty("executed", true);
              data.addProperty("result", result);
              return data;
          } catch (Exception exception) {
              JsonObject data = new JsonObject();
              data.addProperty("executed", false);
              data.addProperty("error", exception.getMessage() == null ? exception.toString() : exception.getMessage());
              return data;
          }
      }
'''

          new = '''    private static JsonObject commandResult(MinecraftServer server, String command) {
          try {
              server.getCommandManager().executeWithPrefix(server.getCommandSource(), command);
              JsonObject data = new JsonObject();
              data.addProperty("executed", true);
              return data;
          } catch (Exception exception) {
              JsonObject data = new JsonObject();
              data.addProperty("executed", false);
              data.addProperty("error", exception.getMessage() == null ? exception.toString() : exception.getMessage());
              return data;
          }
      }
'''

          if old not in text:
              print('commandResult block already fixed or formatting differs')
          else:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Source changed:', text != original)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java; then
            echo "No source fix needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          git commit -m "Fix command tool compilation"
          git push

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent-repaired
          path: build/libs/*.jar
