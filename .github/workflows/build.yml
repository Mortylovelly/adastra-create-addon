name: Build Minecraft AI Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Repair AI agent source
        run: python3 scripts/repair_ai_agent.py

      - name: Clean duplicated diagnostics
        run: python3 scripts/cleanup_ai_agent.py

      - name: Verify AI agent source
        shell: bash
        run: |
          set -e
          ! grep -F 'int result = server.getCommandManager().executeWithPrefix' src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          grep -F 'google/gemma-4-26b-a4b-it:free' src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          grep -F 'openrouter/free' src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          grep -F 'MAX_TOOL_ROUNDS = 4' src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          grep -F 'API_HISTORY_CHARS = 3500' src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java

      - name: Commit repaired source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          if git diff --quiet -- src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java; then
            echo 'AI source already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          git commit -m 'Repair AI agent behavior [skip ci]'
          git push origin HEAD:main

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent
          path: build/libs/*.jar
