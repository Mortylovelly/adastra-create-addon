name: Build Minecraft AI Agent

on:
  push:
    branches: [ main, minecraft-1.20.1-fabric ]
  pull_request:
    branches: [ main, minecraft-1.20.1-fabric ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent-1.20.1
          path: build/libs/*.jar
