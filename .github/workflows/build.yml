name: Build Minecraft AI Agent

on:
  push:
    branches: [ main, minecraft-1.20.1-fabric ]
  pull_request:
    branches: [ main, minecraft-1.20.1-fabric ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Apply AI economy optimization
        run: python3 scripts/finalize_ai_economy.py

      - name: Validate AI source
        run: python3 -m py_compile scripts/finalize_ai_economy.py

      - name: Commit normalized source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          if git diff --quiet -- src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java; then
            echo 'AI service source already optimized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          git commit -m 'Optimize AI token economy [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent
          path: build/libs/*.jar
