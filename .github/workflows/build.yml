name: Build Minecraft AI Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Add reliable AI network diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java')
          text = path.read_text(encoding='utf-8')

          # Normalize diagnostic imports without creating duplicates.
          text = re.sub(r'import java\.net\.InetAddress;\n', '', text)
          text = text.replace(
              'import java.net.ConnectException;\n',
              'import java.net.ConnectException;\n'
              'import java.net.InetAddress;\n'
              'import java.net.InetSocketAddress;\n'
              'import java.net.Socket;\n'
          )
          text = re.sub(r'(import java\.net\.Socket;\n)(import java\.net\.Socket;\n)+', r'\1', text)

          # Add a diagnostic call immediately before every actual HTTP sendWithRetry.
          call = '        logNetworkDiagnostics(request.uri(), providerName);\n'
          send_line = '        return sendWithRetry(request, providerName, 0)'
          text = text.replace(
              send_line,
              call + send_line,
              1
          ) if call not in text else text

          # Add the helper once, immediately before deepSeekMessage.
          marker = '    private static JsonObject deepSeekMessage(String content) {'
          helper = '''    private static void logNetworkDiagnostics(URI uri, String providerName) {
        String host = uri.getHost();
        System.out.println("[Minecraft AI Agent][" + providerName + "] NET DIAGNOSTICS START host=" + host + " port=443");

        try {
            long dnsStarted = System.nanoTime();
            InetAddress[] addresses = InetAddress.getAllByName(host);
            long dnsMs = Duration.ofNanos(System.nanoTime() - dnsStarted).toMillis();

            StringBuilder resolved = new StringBuilder();
            for (int i = 0; i < addresses.length; i++) {
                if (i > 0) resolved.append(", ");
                resolved.append(addresses[i].getHostAddress());
            }
            System.out.println("[Minecraft AI Agent][" + providerName + "] DNS OK in " + dnsMs + " ms -> " + resolved);

            for (InetAddress address : addresses) {
                long tcpStarted = System.nanoTime();
                try (Socket socket = new Socket()) {
                    socket.connect(new InetSocketAddress(address, 443), 5000);
                    long tcpMs = Duration.ofNanos(System.nanoTime() - tcpStarted).toMillis();
                    System.out.println("[Minecraft AI Agent][" + providerName + "] TCP 443 OK "
                            + address.getHostAddress() + " in " + tcpMs + " ms");
                } catch (Exception exception) {
                    long tcpMs = Duration.ofNanos(System.nanoTime() - tcpStarted).toMillis();
                    System.err.println("[Minecraft AI Agent][" + providerName + "] TCP 443 FAIL "
                            + address.getHostAddress() + " after " + tcpMs + " ms: "
                            + exception.getClass().getSimpleName() + " | " + exception.getMessage());
                }
            }
        } catch (Exception exception) {
            System.err.println("[Minecraft AI Agent][" + providerName + "] DNS FAIL for " + host + ": "
                    + exception.getClass().getSimpleName() + " | " + exception.getMessage());
        }

        System.out.println("[Minecraft AI Agent][" + providerName + "] NET DIAGNOSTICS END");
    }

'''
          if 'private static void logNetworkDiagnostics(URI uri, String providerName)' not in text:
              if marker not in text:
                  raise SystemExit('Could not find deepSeekMessage marker')
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit diagnostic source
        shell: bash
        run: |
          if git diff --quiet -- src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java; then
            echo "No diagnostic source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          git commit -m "Add reliable AI network diagnostics"
          git push

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"
            if ./gradlew build --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent
          path: build/libs/*.jar
