name: Build Minecraft AI Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Add Java network diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'import java.net.ConnectException;\n',
              'import java.net.ConnectException;\nimport java.net.InetAddress;\n'
          )

          marker = '''        long started=System.nanoTime();\n        System.out.println("[Minecraft AI Agent]["+providerName+"] HTTP request start: " + uri + " | attempt " + (attempt+1) + "/" + (NETWORK_RETRIES+1) + " | payload=" + payload.toString().length() + " chars");'''
          replacement = '''        long started=System.nanoTime();\n        System.out.println("[Minecraft AI Agent]["+providerName+"] HTTP request start: " + uri + " | attempt " + (attempt+1) + "/" + (NETWORK_RETRIES+1) + " | payload=" + payload.toString().length() + " chars");\n        logDnsDiagnostics(uri, providerName);'''
          text = text.replace(marker, replacement)

          marker_method = '''    private static JsonObject deepSeekMessage(String content){'''
          helper = '''    private static void logDnsDiagnostics(URI uri, String providerName) {\n        try {\n            InetAddress[] addresses = InetAddress.getAllByName(uri.getHost());\n            StringBuilder resolved = new StringBuilder();\n            for (int i = 0; i < addresses.length; i++) {\n                if (i > 0) resolved.append(", ");\n                resolved.append(addresses[i].getHostAddress());\n            }\n            System.out.println("[Minecraft AI Agent]["+providerName+"] DNS " + uri.getHost() + " -> " + resolved);\n        } catch (Exception exception) {\n            System.err.println("[Minecraft AI Agent]["+providerName+"] DNS ERROR for " + uri.getHost() + ": " + exception.getClass().getSimpleName() + " | " + exception.getMessage());\n        }\n    }\n\n'''
          if marker_method in text and 'logDnsDiagnostics(URI uri, String providerName)' not in text:
              text = text.replace(marker_method, helper + marker_method)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source diagnostic fix
        shell: bash
        run: |
          if git diff --quiet -- src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java; then
            echo "No source diagnostic changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          git commit -m "Add AI API network diagnostics"
          git push

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"
            if ./gradlew build --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent
          path: build/libs/*.jar
