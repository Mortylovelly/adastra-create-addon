name: Build Minecraft AI Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Fix Gson compatibility and add AI network diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java')
          text = path.read_text(encoding='utf-8')

          # Gson compatibility used by the current project.
          text = text.replace(
              'DEEPSEEK_CONVERSATION.clear();',
              'while (!DEEPSEEK_CONVERSATION.isEmpty()) DEEPSEEK_CONVERSATION.remove(DEEPSEEK_CONVERSATION.size() - 1);'
          )
          text = text.replace(
              'GROQ_CONVERSATION.clear();',
              'while (!GROQ_CONVERSATION.isEmpty()) GROQ_CONVERSATION.remove(GROQ_CONVERSATION.size() - 1);'
          )

          # Normalize diagnostic imports.
          text = re.sub(r'^import java\\.net\\.(InetAddress|InetSocketAddress|Socket);\\s*$', '', text, flags=re.MULTILINE)
          import_marker = 'import java.net.ConnectException;'
          imports = (
              'import java.net.ConnectException;\n'
              'import java.net.InetAddress;\n'
              'import java.net.InetSocketAddress;\n'
              'import java.net.Socket;'
          )
          if import_marker not in text:
              raise SystemExit('ConnectException import marker not found')
          text = text.replace(import_marker, imports, 1)

          helper = '''    private static void logNetworkDiagnostics(URI uri, String providerName) {
        String host = uri.getHost();
        System.out.println("[Minecraft AI Agent][" + providerName + "] NET DIAGNOSTICS START host=" + host + " port=443");

        try {
            long dnsStarted = System.nanoTime();
            InetAddress[] addresses = InetAddress.getAllByName(host);
            long dnsMs = Duration.ofNanos(System.nanoTime() - dnsStarted).toMillis();

            StringBuilder resolved = new StringBuilder();
            for (int i = 0; i < addresses.length; i++) {
                if (i > 0) resolved.append(", ");
                resolved.append(addresses[i].getHostAddress());
            }
            System.out.println("[Minecraft AI Agent][" + providerName + "] DNS OK in " + dnsMs + " ms -> " + resolved);

            for (InetAddress address : addresses) {
                long tcpStarted = System.nanoTime();
                try (Socket socket = new Socket()) {
                    socket.connect(new InetSocketAddress(address, 443), 5000);
                    long tcpMs = Duration.ofNanos(System.nanoTime() - tcpStarted).toMillis();
                    System.out.println("[Minecraft AI Agent][" + providerName + "] TCP 443 OK " + address.getHostAddress() + " in " + tcpMs + " ms");
                } catch (Exception exception) {
                    long tcpMs = Duration.ofNanos(System.nanoTime() - tcpStarted).toMillis();
                    System.err.println("[Minecraft AI Agent][" + providerName + "] TCP 443 FAIL " + address.getHostAddress() + " after " + tcpMs + " ms: " + exception.getClass().getSimpleName() + " | " + exception.getMessage());
                }
            }
        } catch (Exception exception) {
            System.err.println("[Minecraft AI Agent][" + providerName + "] DNS FAIL for " + host + ": " + exception.getClass().getSimpleName() + " | " + exception.getMessage());
        }

        System.out.println("[Minecraft AI Agent][" + providerName + "] NET DIAGNOSTICS END");
    }

'''

          helper_marker = '    private static JsonObject deepSeekMessage(String content) {'
          if 'private static void logNetworkDiagnostics(URI uri, String providerName)' not in text:
              if helper_marker not in text:
                  raise SystemExit('deepSeekMessage marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          call = '        logNetworkDiagnostics(request.uri(), providerName)'
          send_line = '        return sendWithRetry(request, providerName, 0)'
          if call not in text:
              if send_line not in text:
                  raise SystemExit('sendWithRetry marker not found')
              text = text.replace(send_line, call + ';\n' + send_line, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source diagnostics
        shell: bash
        run: |
          if git diff --quiet -- src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/mortylovelly/minecraftai/client/AiAgentService.java
          git commit -m "Add AI network diagnostics"
          git push

      - name: Build
        shell: bash
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-agent
          path: build/libs/*.jar
