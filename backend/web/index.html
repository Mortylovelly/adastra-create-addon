<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minecraft AI Agent</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #111318; color: #eee; display: grid; place-items: center; }
    .app { width: min(900px, 94vw); height: min(720px, 92vh); display: flex; flex-direction: column; border: 1px solid #2f3440; border-radius: 16px; overflow: hidden; background: #181b21; box-shadow: 0 18px 60px #0008; }
    header { padding: 18px 22px; border-bottom: 1px solid #2f3440; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 18px; margin: 0; }
    #status { font-size: 12px; color: #999; }
    #messages { flex: 1; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #2d5cff; }
    .ai { align-self: flex-start; background: #262b33; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #2f3440; }
    input { flex: 1; background: #111318; border: 1px solid #343a46; border-radius: 10px; color: #eee; padding: 12px; outline: none; }
    button { border: 0; border-radius: 10px; padding: 0 18px; background: #2d5cff; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Minecraft AI Agent</h1>
    <div id="status">Проверка связи...</div>
  </header>
  <main id="messages">
    <div class="msg ai">Привет. Я подключён к AI bridge. Напиши, что сделать в Minecraft.</div>
  </main>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Например: осмотри территорию вокруг меня">
    <button id="send">Отправить</button>
  </form>
</div>
<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const messages = document.getElementById('messages');
  const status = document.getElementById('status');

  function addMessage(text, kind) {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  async function refreshStatus() {
    try {
      const response = await fetch('/health');
      const data = await response.json();
      status.textContent = data.bridge?.connected ? `Minecraft: онлайн · ${data.model}` : `Minecraft bridge: офлайн · ${data.model}`;
    } catch {
      status.textContent = 'Backend: офлайн';
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    input.value = '';
    send.disabled = true;

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Request failed');
      addMessage(data.reply, 'ai');
    } catch (error) {
      addMessage('Ошибка: ' + error.message, 'ai');
    } finally {
      send.disabled = false;
      input.focus();
      refreshStatus();
    }
  });

  refreshStatus();
  setInterval(refreshStatus, 5000);
</script>
</body>
</html>
