<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minecraft AI Agent</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111318;
      color: #e8e8e8;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(620px, 92vw);
      height: min(560px, 84vh);
      display: flex;
      flex-direction: column;
      border: 1px solid #30343d;
      border-radius: 10px;
      overflow: hidden;
      background: #181b21;
    }

    header {
      min-height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid #30343d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
    }

    #status {
      font-size: 11px;
      color: #9a9da5;
      white-space: nowrap;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
    }

    .msg {
      max-width: 78%;
      padding: 8px 10px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.35;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #2b55c7;
    }

    .ai {
      align-self: flex-start;
      background: #262a31;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #30343d;
    }

    input {
      min-width: 0;
      flex: 1;
      background: #111318;
      border: 1px solid #343944;
      border-radius: 7px;
      color: #eee;
      padding: 9px 10px;
      font-size: 13px;
      outline: none;
    }

    input:focus {
      border-color: #596172;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 0 13px;
      background: #2b55c7;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Minecraft AI Agent</h1>
    <div id="status">Проверка связи...</div>
  </header>

  <main id="messages">
    <div class="msg ai">Привет. Напиши, что сделать в Minecraft.</div>
  </main>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Например: выдай мне алмазный меч">
    <button id="send">Отправить</button>
  </form>
</div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const messages = document.getElementById('messages');
  const status = document.getElementById('status');

  function addMessage(text, kind) {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  async function refreshStatus() {
    try {
      const response = await fetch('/health');
      const data = await response.json();
      status.textContent = data.bridge?.connected
        ? `Minecraft: онлайн · ${data.model}`
        : `Minecraft: офлайн · ${data.model}`;
    } catch {
      status.textContent = 'Backend: офлайн';
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    input.value = '';
    send.disabled = true;

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Request failed');
      addMessage(data.reply, 'ai');
    } catch (error) {
      addMessage('Ошибка: ' + error.message, 'ai');
    } finally {
      send.disabled = false;
      input.focus();
      refreshStatus();
    }
  });

  input.focus();
  refreshStatus();
  setInterval(refreshStatus, 5000);
</script>
</body>
</html>
